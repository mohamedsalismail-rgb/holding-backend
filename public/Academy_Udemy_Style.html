<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أكاديمية المجموعة | منصة التدريب المؤسسي</title>
<link rel="stylesheet" href="tailwind.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#A435F0; --purple-hover:#8710D8;
  --dark:#2D2F31; --bg:#FFFFFF; --card-bg:#F7F9FA; --border:#D1D7DC; --text-2:#6A6F73;
}
*{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--dark); font-family:'Tajawal','Readex Pro',sans-serif; }
.btn-purple{ background:var(--purple); color:#fff; transition:.15s; }
.btn-purple:hover{ background:var(--purple-hover); }
.btn-outline{ border:1px solid var(--dark); color:var(--dark); background:transparent; transition:.15s; }
.btn-outline:hover{ background:var(--dark); color:#fff; }
.card{ background:var(--bg); border:1px solid var(--border); transition:.15s; }
.card:hover{ box-shadow:0 4px 16px rgba(0,0,0,.12); }
.tab-btn.active{ border-bottom:3px solid var(--dark); color:var(--dark); font-weight:700; }
.tab-btn:not(.active){ color:var(--text-2); border-bottom:3px solid transparent; }
.tab-btn:not(.active):hover{ color:var(--dark); }
.acc-header{ transition:.15s; }
.acc-header:hover{ background:#F7F9FA; }
.star{ color:#D1D7DC; }
.progress-track{ background:#E4E7E9; }
.progress-fill{ background:var(--purple); }
.line-clamp-2{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.portal-link{ transition:.15s; text-decoration:none; }
.portal-link:hover{ background:var(--dark); color:#fff !important; }
.active-lesson{ color:var(--purple); font-weight:700; }
::-webkit-scrollbar{ width:6px; }
::-webkit-scrollbar-thumb{ background:#C0C4C7; border-radius:4px; }
</style>
</head>
<body>

<!-- ===== Header (persistent) ===== -->
<header class="border-b sticky top-0 z-30" style="border-color:var(--border); background:var(--bg);">
  <div class="max-w-[1400px] mx-auto px-5 h-16 flex items-center gap-4">
    <a href="#/" class="font-extrabold text-xl shrink-0" style="color:var(--dark);">أكاديمية <span style="color:var(--purple);">المجموعة</span></a>

    <select id="categorySelect" onchange="filterCourses()" class="hidden md:block text-sm rounded-md px-2 py-2" style="border:1px solid var(--border); color:var(--dark);">
      <option value="">التصنيفات</option>
      <option value="المحاسبة والمالية">المحاسبة والمالية</option>
      <option value="الضرائب وZATCA">الضرائب وZATCA</option>
      <option value="الإدارة والقيادة">الإدارة والقيادة</option>
      <option value="التقنية والأتمتة">التقنية والأتمتة</option>
    </select>

    <div class="flex-1 relative max-w-xl">
      <input id="librarySearch" oninput="onHeaderSearch()" placeholder="ابحث عن أي شيء"
        class="w-full rounded-full py-2 pr-4 pl-10 text-sm focus:outline-none" style="border:1px solid var(--dark);">
      <svg class="w-4 h-4 absolute top-1/2 -translate-y-1/2 left-3" style="color:var(--dark);" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-4.35-4.35M17 10.5A6.5 6.5 0 114 10.5a6.5 6.5 0 0113 0z"/></svg>
    </div>

    <nav class="hidden lg:flex items-center gap-4 text-sm font-medium shrink-0">
      <a href="#/" class="hover:text-[var(--purple)]">تعلّمي</a>
      <a href="#/" class="hover:text-[var(--purple)]">مساراتي</a>
    </nav>

    <a href="index.html" class="portal-link flex items-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-bold shrink-0" style="border:1px solid var(--dark); color:var(--dark);" title="الانتقال إلى البوابة التنفيذية">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      <span class="hidden sm:inline">البوابة التنفيذية</span>
    </a>

    <div class="w-8 h-8 rounded-full flex items-center justify-center text-white text-xs font-bold shrink-0" style="background:var(--dark);">ق</div>
  </div>
</header>

<main id="view-root" class="max-w-[1400px] mx-auto"></main>

<script>
// ===================== بيانات نموذجية (Template) — ليست بيانات حقيقية =====================
const COURSES = [
  { id:1, category:"المحاسبة والمالية", title:"[بانتظار إدخال اسم الدورة] — أساسيات المحاسبة المالية وفق IFRS/SOCPA",
    instructor:"[بانتظار الإدخال]", hours:"—",
    sections:[
      { title:"الوحدة 1: مبادئ القيد المزدوج", lessons:[{t:"مقدمة عن دورة القيد المحاسبي", d:"—"},{t:"تحليل القوائم المالية الأساسية", d:"—"}] },
      { title:"الوحدة 2: الإقفال الشهري", lessons:[{t:"المستحقات والمقدمات", d:"—"},{t:"التسويات الجردية", d:"—"}] },
    ] },
  { id:2, category:"الضرائب وZATCA", title:"[بانتظار إدخال اسم الدورة] — ضريبة القيمة المضافة والامتثال مع ZATCA",
    instructor:"[بانتظار الإدخال]", hours:"—",
    sections:[
      { title:"الوحدة 1: أساسيات VAT", lessons:[{t:"نطاق الضريبة والإعفاءات", d:"—"},{t:"إعداد الإقرار الضريبي", d:"—"}] },
      { title:"الوحدة 2: الفوترة الإلكترونية", lessons:[{t:"متطلبات المرحلة الثانية", d:"—"}] },
    ] },
  { id:3, category:"الإدارة والقيادة", title:"[بانتظار إدخال اسم الدورة] — الحوكمة المالية للشركات القابضة",
    instructor:"[بانتظار الإدخال]", hours:"—",
    sections:[
      { title:"الوحدة 1: هياكل الحوكمة", lessons:[{t:"مجلس الشخص الواحد", d:"—"},{t:"مصفوفة الصلاحيات SoA", d:"—"}] },
    ] },
  { id:4, category:"التقنية والأتمتة", title:"[بانتظار إدخال اسم الدورة] — أتمتة العمليات المالية بالذكاء الاصطناعي",
    instructor:"[بانتظار الإدخال]", hours:"—",
    sections:[
      { title:"الوحدة 1: مقدمة في الأتمتة", lessons:[{t:"محركات المطابقة البنكية", d:"—"},{t:"طوابير الاعتماد", d:"—"}] },
    ] },
  { id:5, category:"المحاسبة والمالية", title:"[بانتظار إدخال اسم الدورة] — التخطيط المالي والتدفقات النقدية",
    instructor:"[بانتظار الإدخال]", hours:"—",
    sections:[ { title:"الوحدة 1: بناء نموذج تدفق نقدي", lessons:[{t:"السيناريوهات الثلاثة", d:"—"}] } ] },
  { id:6, category:"الإدارة والقيادة", title:"[بانتظار إدخال اسم الدورة] — إدارة المخاطر التشغيلية",
    instructor:"[بانتظار الإدخال]", hours:"—",
    sections:[ { title:"الوحدة 1: سجل المخاطر", lessons:[{t:"تصنيف الفجوات", d:"—"}] } ] },
];

// ===================== إعداد الاتصال =====================
// نقطة الاتصال الحية بنواة Claude — عبر خادم هذا الموقع نفسه (server.js).
// المفتاح ANTHROPIC_API_KEY يبقى على الخادم ولا يصل المتصفح إطلاقاً.
// لتحويل الاتصال إلى خادم آخر، غيّر هذه القيمة إلى عنوانه الكامل لا أكثر.
const AGENT_ENDPOINT = "/api/command";

const TUTOR_SYSTEM_PROMPT = `أنت مساعد تعلّم ذكي داخل منصة "أكاديمية المجموعة" التدريبية.
مبادئ ملزمة:
- دورك تعليمي/توضيحي بحت. لا تؤكد إتمام أي اختبار أو منح شهادة أو تسجيل تقدّم فعلي — هذه بيانات النظام وليست من صلاحياتك.
- ممنوع اختلاق أي محتوى أكاديمي كأنه من منهج حقيقي للدورة إن لم يُزوَّدك به المستخدم صراحة — وضّح أنك تشرح بشكل عام.
- أسلوبك تعليمي مباشر ومبسّط بالعربية.`;

// ===================== التوجيه (Hash Router) =====================
function router(){
  const hash = location.hash || '#/';
  const root = document.getElementById('view-root');
  const m = hash.match(/^#\/course\/(\d+)/);
  if(m){
    const course = COURSES.find(c => c.id === Number(m[1])) || COURSES[0];
    root.innerHTML = coursePlayerHTML(course);
    initPlayer(course);
  } else {
    root.innerHTML = libraryHTML();
    filterCourses(); // حافظ على البحث/التصنيف النشط عند العودة للمكتبة
  }
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', router);
window.addEventListener('DOMContentLoaded', router);

// ===================== مكتبة الدورات =====================
function libraryHTML(){
  return `
  <section class="px-5 py-10 mb-8" style="background:var(--dark);">
    <div class="max-w-3xl">
      <h1 class="text-white text-2xl md:text-3xl font-extrabold mb-2">التدريب المؤسسي لموظفي المجموعة</h1>
      <p class="text-white/70 text-sm mb-5">حقائب معتمدة من ذراع التدريب والبحوث — مواءمة مباشرة مع سجل الحوكمة والقرارات المعتمدة.</p>
    </div>
  </section>

  <div class="px-5">
    <p class="text-[11px] rounded-lg px-3 py-2 mb-6" style="color:#8710D8; background:#F6E8FE; border:1px solid #E4C6F9;">
      بيانات الدورات أدناه نماذج قالب توضيحية للتصميم فقط (العناوين، المدربون، الساعات) — بانتظار ربط المحتوى التدريبي الفعلي المعتمد.
    </p>

    <!-- KPI Bar -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
      ${kpiCard("عدد الدورات النشطة")}
      ${kpiCard("معدل إكمال الفريق")}
      ${kpiCard("ساعات التدريب المكتملة")}
      ${kpiCard("عدد الشهادات الصادرة")}
    </div>

    <h2 class="text-lg font-bold mb-4">دورات مقترحة للمجموعة</h2>
    <div id="courseGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 pb-16">
      ${COURSES.map(courseCardHTML).join('')}
    </div>
    <p id="libraryEmpty" class="hidden text-center text-xs pb-16" style="color:var(--text-2);">لا توجد دورات مطابقة لبحثك الحالي.</p>
  </div>`;
}

function kpiCard(label){
  return `
  <div class="card rounded-lg p-4">
    <p class="text-xs mb-2" style="color:var(--text-2);">${label}</p>
    <p class="text-2xl font-extrabold">—</p>
    <p class="text-[10px] mt-1" style="color:var(--text-2);">[بانتظار الإدخال]</p>
  </div>`;
}

function courseCardHTML(c){
  return `
  <div class="card rounded-lg overflow-hidden searchable-course" data-title="${c.title.toLowerCase()}" data-cat="${c.category}">
    <div class="h-32 flex items-center justify-center text-white text-3xl font-extrabold" style="background:linear-gradient(135deg, var(--purple), #6a1cad);">
      ${c.title.charAt(0)}
    </div>
    <div class="p-3">
      <p class="text-[10px] font-semibold mb-1" style="color:var(--purple);">${c.category}</p>
      <h3 class="text-sm font-bold leading-snug mb-1 line-clamp-2" style="min-height:2.6em;">${c.title}</h3>
      <p class="text-xs mb-2" style="color:var(--text-2);">${c.instructor}</p>
      <div class="flex items-center gap-1 mb-2">
        ${'<svg class="w-3.5 h-3.5 star" fill="currentColor" viewBox="0 0 20 20"><path d="M10 15l-5.878 3.09 1.123-6.545L.489 6.91l6.572-.955L10 0l2.939 5.955 6.572.955-4.756 4.635 1.123 6.545z"/></svg>'.repeat(5)}
        <span class="text-[10px] mr-1" style="color:var(--text-2);">لا يوجد تقييم بعد</span>
      </div>
      <div class="w-full h-1.5 rounded-full progress-track mb-1">
        <div class="h-1.5 rounded-full progress-fill" style="width:0%"></div>
      </div>
      <p class="text-[10px] mb-3" style="color:var(--text-2);">لم تبدأ · ${c.hours} ساعة</p>
      <a href="#/course/${c.id}" class="block text-center text-xs font-bold rounded-md py-2 btn-purple">متابعة التعلم</a>
    </div>
  </div>`;
}

function filterCourses(){
  const searchEl = document.getElementById('librarySearch');
  const catEl = document.getElementById('categorySelect');
  const q = searchEl ? searchEl.value.trim().toLowerCase() : '';
  const cat = catEl ? catEl.value : '';
  let visible = 0;
  document.querySelectorAll('.searchable-course').forEach(el=>{
    const match = el.dataset.title.includes(q) && (!cat || el.dataset.cat === cat);
    el.style.display = match ? '' : 'none';
    if(match) visible++;
  });
  const empty = document.getElementById('libraryEmpty');
  if(empty) empty.classList.toggle('hidden', visible > 0);
}

// البحث من الهيدر يعمل في كل الصفحات: إن كنت داخل المشغّل يعيدك إلى المكتبة ثم يُصفّي.
function onHeaderSearch(){
  if(location.hash && location.hash !== '#/'){
    location.hash = '#/';
    setTimeout(filterCourses, 0);
    return;
  }
  filterCourses();
}

// ===================== مشغّل الدورة =====================
function coursePlayerHTML(course){
  return `
  <div class="border-b" style="border-color:var(--border);">
    <div class="px-5 h-14 flex items-center gap-4">
      <a href="#/" class="flex items-center gap-1.5 text-sm font-semibold shrink-0" style="color:var(--dark);">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        المكتبة
      </a>
      <div class="w-px h-5" style="background:var(--border);"></div>
      <h1 class="text-sm font-bold truncate flex-1">${course.title}</h1>
      <div class="hidden md:flex items-center gap-2 shrink-0">
        <div class="w-32 h-1.5 rounded-full progress-track"><div class="h-1.5 rounded-full progress-fill" style="width:0%"></div></div>
        <span class="text-[10px]" style="color:var(--text-2);">0% مكتمل</span>
      </div>
    </div>
  </div>

  <div class="flex flex-col lg:flex-row" style="min-height:calc(100vh - 120px);">
    <!-- Main Area -->
    <div class="flex-1 min-w-0">
      <div class="bg-black flex items-center justify-center" style="aspect-ratio:16/9;">
        <div class="text-center text-white/60">
          <svg class="w-14 h-14 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><circle cx="12" cy="12" r="9" stroke-width="1.5"/></svg>
          <p class="text-xs">مشغّل الفيديو — بانتظار ربط ملف الدرس الفعلي</p>
        </div>
      </div>

      <div class="border-b px-5" style="border-color:var(--border);">
        <div class="flex gap-6 overflow-x-auto">
          <button onclick="switchPlayerTab('overview')" id="ptab-overview" class="tab-btn active text-xs py-3 shrink-0">نظرة عامة</button>
          <button onclick="switchPlayerTab('resources')" id="ptab-resources" class="tab-btn text-xs py-3 shrink-0">المرفقات</button>
          <button onclick="switchPlayerTab('assistant')" id="ptab-assistant" class="tab-btn text-xs py-3 shrink-0">المساعد الذكي</button>
          <button onclick="switchPlayerTab('notes')" id="ptab-notes" class="tab-btn text-xs py-3 shrink-0">الملاحظات</button>
          <button onclick="switchPlayerTab('quiz')" id="ptab-quiz" class="tab-btn text-xs py-3 shrink-0">الاختبار</button>
        </div>
      </div>

      <div class="p-5">
        <div id="pane-overview">
          <h3 class="text-sm font-bold mb-2">عن هذه الدورة</h3>
          <p class="text-xs leading-relaxed" style="color:var(--text-2);">${course.instructor} · ${course.category} · [وصف الدورة بانتظار الإدخال الفعلي]</p>
        </div>
        <div id="pane-resources" class="hidden">
          <h3 class="text-sm font-bold mb-2">المرفقات (PDF)</h3>
          <p class="text-xs" style="color:var(--text-2);">لا توجد مرفقات مرفوعة بعد لهذه الدورة.</p>
        </div>
        <div id="pane-assistant" class="hidden">
          <div class="flex flex-col gap-3">
            <p class="text-[10px] rounded-lg px-3 py-2" style="color:#8710D8; background:#F6E8FE; border:1px solid #E4C6F9;">
المساعد متصل مباشرة بنواة Claude عبر خادم هذه الصفحة <span dir="ltr">/api/command</span>. الردود توضيحية تعليمية ولا تُسجّل تقدّماً ولا تمنح شهادة.
            </p>
            <textarea id="assistantInput" rows="3" placeholder="اسأل المساعد عن محتوى هذا الدرس..."
              class="w-full text-xs rounded-md p-2.5 focus:outline-none" style="border:1px solid var(--border);"></textarea>
            <button id="assistantBtn" onclick="askAssistant()" class="self-start text-xs font-bold px-4 py-2 rounded-md btn-purple">إرسال</button>
            <div id="assistantOutput" class="text-xs rounded-lg p-3 min-h-[80px]" style="background:var(--card-bg); border:1px solid var(--border); color:var(--dark);">
              [System]: بانتظار سؤالك...
            </div>
          </div>
        </div>
        <div id="pane-notes" class="hidden">
          <h3 class="text-sm font-bold mb-2">ملاحظاتي</h3>
          <textarea id="notesArea" rows="8" placeholder="اكتب ملاحظاتك هنا — تُحفظ تلقائياً على هذا الجهاز فقط..."
            class="w-full text-xs rounded-md p-3 focus:outline-none" style="border:1px solid var(--border);"></textarea>
          <p id="notesStatus" class="text-[10px] mt-1.5" style="color:var(--text-2);"></p>
        </div>
        <div id="pane-quiz" class="hidden">
          <p class="text-xs" style="color:var(--text-2);">الاختبار قيد الإعداد — لا توجد أسئلة معتمدة بعد لهذه الدورة.</p>
        </div>
      </div>
    </div>

    <!-- Curriculum Sidebar -->
    <aside class="w-full lg:w-80 border-t lg:border-t-0 lg:border-r shrink-0" style="border-color:var(--border);">
      <div class="p-4 border-b" style="border-color:var(--border);"><h3 class="text-sm font-bold">محتوى الدورة</h3></div>
      <div id="curriculumAccordion">
        ${course.sections.map((s, si) => `
          <div class="border-b" style="border-color:var(--border);">
            <button onclick="toggleAccordion(${si})" class="acc-header w-full flex items-center justify-between px-4 py-3 text-right">
              <span class="text-xs font-bold">${s.title}</span>
              <svg id="acc-icon-${si}" class="w-3.5 h-3.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
            </button>
            <div id="acc-body-${si}" class="hidden px-4 pb-3">
              ${s.lessons.map((l, li) => `
                <div class="flex items-center justify-between py-2 text-xs cursor-pointer lesson-row ${si===0 && li===0 ? 'active-lesson' : ''}"
                     onclick="setActiveLesson(this)">
                  <span class="flex items-center gap-2">
                    <svg class="w-3 h-3 shrink-0" style="color:var(--text-2);" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><circle cx="12" cy="12" r="9" stroke-width="2"/></svg>
                    ${l.t}
                  </span>
                  <span style="color:var(--text-2);">${l.d}</span>
                </div>`).join('')}
            </div>
          </div>`).join('')}
      </div>

      <!-- رابط متبادل: العودة إلى البوابة التنفيذية من داخل المشغّل -->
      <div class="p-4 border-t" style="border-color:var(--border);">
        <a href="index.html" class="portal-link flex items-center justify-center gap-2 w-full rounded-md py-2 text-xs font-bold" style="border:1px solid var(--dark); color:var(--dark);">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
          البوابة التنفيذية
        </a>
      </div>
    </aside>
  </div>`;
}

function initPlayer(course){
  toggleAccordion(0); // افتح الوحدة الأولى تلقائياً
  window.__currentCourse = course;
  restoreNotes(course.id);
}

// ===================== الملاحظات (حفظ محلي فعلي لكل دورة) =====================
function notesKey(courseId){ return 'academy:notes:' + courseId; }

function restoreNotes(courseId){
  const area = document.getElementById('notesArea');
  if(!area) return;
  try{ area.value = localStorage.getItem(notesKey(courseId)) || ''; }
  catch(e){ /* التخزين المحلي معطّل في هذا المتصفح — الملاحظات تبقى في الجلسة فقط */ }
  area.oninput = () => saveNotes(courseId);
  updateNotesStatus('');
}

function saveNotes(courseId){
  const area = document.getElementById('notesArea');
  if(!area) return;
  try{
    localStorage.setItem(notesKey(courseId), area.value);
    updateNotesStatus('تم الحفظ محلياً على هذا الجهاز.');
  } catch(e){
    updateNotesStatus('تعذّر الحفظ المحلي — الملاحظات محفوظة في هذه الجلسة فقط.');
  }
}

function updateNotesStatus(msg){
  const el = document.getElementById('notesStatus');
  if(el) el.textContent = msg;
}

function switchPlayerTab(tab){
  ['overview','resources','assistant','notes','quiz'].forEach(t=>{
    document.getElementById('ptab-'+t).classList.toggle('active', t===tab);
    document.getElementById('pane-'+t).classList.toggle('hidden', t!==tab);
  });
}

function toggleAccordion(idx){
  const body = document.getElementById('acc-body-'+idx);
  const icon = document.getElementById('acc-icon-'+idx);
  const isHidden = body.classList.contains('hidden');
  body.classList.toggle('hidden');
  icon.style.transform = isHidden ? 'rotate(180deg)' : 'rotate(0deg)';
}

function setActiveLesson(el){
  document.querySelectorAll('.lesson-row').forEach(r => r.classList.remove('active-lesson'));
  el.classList.add('active-lesson');
}

// ===================== المساعد الذكي (نفس آلية الاتصال العاملة سابقاً) =====================
function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }
function formatOutput(text){ return escapeHtml(text).replace(/\n/g,'<br>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>'); }

async function askAssistant(){
  const input = document.getElementById('assistantInput');
  const q = input.value.trim();
  const out = document.getElementById('assistantOutput');
  const btn = document.getElementById('assistantBtn');
  if(!q) return;
  const course = window.__currentCourse;
  out.innerHTML = `<span style="color:#8710D8">[جارٍ التفكير...]</span>`;
  btn.disabled = true; input.value = '';

  const systemPrompt = TUTOR_SYSTEM_PROMPT + `\n\nسياق الدرس الحالي: دورة "${course.title}" ضمن تصنيف ${course.category}.`;

  try{
    const text = await callTutor(systemPrompt, q);
    out.innerHTML = formatOutput(text);
  } catch(err){
    out.innerHTML = `<span style="color:#B00020">[خطأ اتصال]: ${escapeHtml(err.message)}</span>`;
  } finally { btn.disabled = false; }
}

// اتصال حيّ بنواة Claude عبر AGENT_ENDPOINT. لا يوجد وضع تجريبي ولا اتصال مباشر من المتصفح:
// أي خلل يظهر كما يرده الخادم بالضبط، حتى لا يُخفى سبب العطل خلف رسالة عامة.
async function callTutor(systemPrompt, question){
  let r;
  try{
    r = await fetch(AGENT_ENDPOINT, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ agent:"مساعد تعلّم — أكاديمية المجموعة", system: systemPrompt, command: question })
    });
  } catch(e){
    throw new Error("تعذّر الوصول إلى الخادم — تحقّق من أن الخدمة تعمل.");
  }

  let data = {};
  try{ data = await r.json(); } catch(e){ /* رد غير JSON */ }

  if(!r.ok) throw new Error(data.error || `الخادم أعاد الحالة ${r.status}.`);
  if(!data.output) throw new Error("جاء رد فارغ من الخادم.");
  return data.output;
}
</script>
